spring.application.name=lab-scheduler
server.port=${PORT:8080}

# Database Configuration with Environment Variable Support and safe fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lab_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Jackson Formatting
spring.jackson.serialization.indent-output=true

# Logging Configuration
logging.level.com.lab=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
